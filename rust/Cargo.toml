[package]
name = "openalbion-api"
version = "3.0.0"
edition = "2021"
description = "OpenAlbion API — free and open-source platform providing Albion Online data and an API. File-based (no database)."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"

[profile.release]
lto = true
strip = true

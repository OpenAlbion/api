[package]
name = "openalbion-api"
version = "3.0.0"
edition = "2021"
description = "OpenAlbion API — free and open-source platform providing Albion Online data and an API. File-based (no database)."
license = "MIT"

[features]
default = ["server"]
# Native binary: tokio + hyper server, reqwest client, file-based bug log.
server = [
    "dep:tokio",
    "dep:reqwest",
    "dep:tracing-subscriber",
    "axum/default",
    "tower-http/trace",
]
# Cloudflare Workers (wasm32): see ./worker. Uses the Workers fetch API.
worker = ["dep:worker"]
# Wiki data refresh CLI (`openalbion-fetch`): headless-Chrome bootstrap,
# HTML parsing and the file-backed data store. Never part of Workers builds.
fetch = [
    "server",
    "dep:clap",
    "dep:scraper",
    "dep:chromiumoxide",
    "dep:futures",
]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path", "original-uri"] }
tower = "0.5"
tower-http = { version = "0.6", default-features = false, features = ["cors", "normalize-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tracing = "0.1"
dashmap = "6"

tokio = { version = "1", features = ["full"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

worker = { version = "0.9", features = ["http", "axum"], optional = true }

clap = { version = "4", features = ["derive", "env"], optional = true }
scraper = { version = "0.21", optional = true }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"], optional = true }
futures = { version = "0.3", optional = true }

[[bin]]
name = "openalbion-api"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "openalbion-fetch"
path = "src/bin/openalbion-fetch.rs"
required-features = ["fetch"]

[profile.release]
lto = true
strip = true
